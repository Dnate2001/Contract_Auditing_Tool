version: '3.8'

services:
  demo:
    build:
      context: .
      dockerfile: Dockerfile
    image: contract-auditor:latest
    container_name: contract-auditor-demo
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - DEMO_MODE=true
      - DEMO_USER=${DEMO_USER}
      - DEMO_PASS=${DEMO_PASS}
      - DEMO_CIDR_ALLOW=${DEMO_CIDR_ALLOW}
      - DEMO_TTL_SECONDS=${DEMO_TTL_SECONDS:-10800}
      - PORT=${PORT:-8080}
    env_file:
      - .env
    command: ["python3", "demo_server.py"]
    restart: "no"
    volumes:
      - demo-artifacts:/tmp/artifacts_demo

volumes:
  demo-artifacts:
    driver: local
